<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desi Ipsum cover</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="icons.css" />
    <link rel="stylesheet" href="window.css" />
    <style>
      .canvas {
        width: 1920px;
        height: 960px;
        background: radial-gradient(70% 90% at 85% 40%, #eef2ff 0%, rgba(238, 242, 255, 0) 60%),
          radial-gradient(50% 70% at 5% 100%, #fff1e6 0%, rgba(255, 241, 230, 0) 60%), var(--paper);
      }

      /* Faint big letters from different scripts in the background */
      .ghost {
        position: absolute;
        font-weight: 700;
        line-height: 1;
        color: var(--ink);
        opacity: 0.045;
        user-select: none;
      }

      .left {
        position: absolute;
        left: 150px;
        top: 168px;
        width: 860px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 34px;
      }
      .brand .icon-wrap {
        box-shadow: 0 18px 40px rgba(26, 51, 184, 0.25);
      }
      .wordmark {
        font: 800 120px/1 var(--sans);
        letter-spacing: -0.035em;
      }
      .tagline {
        margin: 46px 0 0;
        font: 400 64px/1.12 var(--serif);
        color: var(--ink-2);
        letter-spacing: -0.01em;
      }
      .tagline em {
        font-style: italic;
        color: var(--blue);
      }
      .natives {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 9px;
        margin-top: 44px;
        width: 900px;
      }
      .natives span {
        font-size: 22px;
        line-height: 1;
        padding: 10px 13px 9px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink-2);
      }
      .extras {
        margin-top: 34px;
        font: 600 24px/1.4 var(--sans);
        color: var(--ink-3);
      }
      .extras b {
        color: var(--ink);
        font-weight: 700;
      }

      .windows {
        position: absolute;
        left: 1150px;
        top: 70px;
        width: 700px;
        height: 830px;
      }
      .windows .pw {
        position: absolute;
      }
      .footer {
        position: absolute;
        left: 150px;
        bottom: 64px;
        font: 600 22px/1 var(--sans);
        color: var(--ink-3);
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <!-- 1920×960 Figma Community cover. Query: ?icon=1..4 -->
    <div class="canvas" id="canvas">
      <div class="left">
        <div class="brand" id="brand"><div class="wordmark">Desi Ipsum</div></div>
        <p class="tagline">Placeholder text in <em>15 Indian languages</em>, in the right script.</p>
        <div class="natives" id="natives"></div>
        <div class="extras">Plus <b>Lorem ipsum</b> &amp; <b>Shakespeare</b> · <b>Fill text box</b> · <b>Quick actions</b></div>
      </div>
      <div class="windows" id="windows"></div>
      <div class="footer">Works in Figma Design · FigJam · Figma Slides · Figma Buzz</div>
    </div>

    <script src="icons.js"></script>
    <script src="samples.js"></script>
    <script src="window.js"></script>
    <script>
      const icon = Number(new URLSearchParams(location.search).get("icon") || 1);
      const canvas = document.getElementById("canvas");

      // Background ghost letters
      [
        ["अ", "Hindi", 420, -40, -60, -8],
        ["অ", "Bangla", 300, 760, 520, 6],
        ["அ", "Tamil", 260, 1020, -70, -4],
        ["ಅ", "Kannada", 300, 1620, 640, 8],
        ["ꯑ", "Manipuri", 220, 880, 760, 0],
        ["ᱚ", "Santali", 240, 30, 640, -6],
        ["ਅ", "Punjabi", 220, 1700, -40, 4],
      ].forEach(([ch, lang, size, x, y, rot]) => {
        const g = document.createElement("div");
        g.className = "ghost f-" + lang;
        g.textContent = ch;
        Object.assign(g.style, { fontSize: size + "px", left: x + "px", top: y + "px", transform: `rotate(${rot}deg)` });
        canvas.prepend(g);
      });

      document.getElementById("brand").prepend(renderIcon(icon, 140, { rounded: true }));

      // Native names of the 15 Indian languages, each in its own script font
      const natives = document.getElementById("natives");
      Object.entries(SAMPLES)
        .filter(([, s]) => s.group === "desi")
        .forEach(([id, s]) => {
          const chip = document.createElement("span");
          chip.className = "f-" + id;
          chip.textContent = s.native;
          natives.appendChild(chip);
        });

      // Two real plugin windows: dark behind, light in front
      const wins = document.getElementById("windows");
      const dark = pluginWindow({ theme: "dark", icon, scale: 1.45 });
      Object.assign(dark.style, { left: "290px", top: "40px" });
      const light = pluginWindow({ theme: "light", icon, scale: 1.45 });
      Object.assign(light.style, { left: "0px", top: "120px" });
      wins.append(dark, light);
    </script>
  </body>
